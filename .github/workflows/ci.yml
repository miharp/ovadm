---
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  markdown:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v23
        with:
          globs: '**/*.md'

  unit:
    name: Plan unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run BoltSpec plan tests
        run: bundle exec rspec spec/plans/

  build:
    name: Forge build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Lint metadata.json
        run: bundle exec metadata-json-lint metadata.json

      - name: REFERENCE.md is up to date
        # Regenerate with: bundle exec rake strings:generate:reference
        run: bundle exec rake strings:validate:reference

      - name: Build the module
        # The same build the Release workflow uploads, so a tag only adds the
        # upload. The package must hold the plans and tasks and nothing local.
        run: |
          bundle exec rake module:build
          tar -tzf pkg/*.tar.gz | tee "$RUNNER_TEMP/contents.txt"
          grep -q '/plans/install.pp$' "$RUNNER_TEMP/contents.txt"
          grep -q '/tasks/precheck.sh$' "$RUNNER_TEMP/contents.txt"
          ! grep -E '/(spec|docker|\.github)/' "$RUNNER_TEMP/contents.txt"

  acceptance:
    name: Acceptance (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu2204
            image: ubuntu:22.04
            bootstrap: "apt-get update -qq && apt-get install -y -qq curl ca-certificates"
          - platform: ubuntu2404
            image: ubuntu:24.04
            bootstrap: "apt-get update -qq && apt-get install -y -qq curl ca-certificates"
          - platform: debian12
            image: debian:12
            bootstrap: "apt-get update -qq && apt-get install -y -qq curl ca-certificates"
          - platform: rocky9
            image: rockylinux:9
            bootstrap: "dnf install -y -q ca-certificates"

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Start test container (${{ matrix.platform }})
        run: |
          docker pull ${{ matrix.image }}
          docker run -d --name ovadm-acceptance ${{ matrix.image }} sleep infinity

      - name: Bootstrap container
        run: |
          docker exec ovadm-acceptance bash -c "${{ matrix.bootstrap }}"

      - name: Run acceptance tests
        run: bundle exec rspec spec/acceptance/

      - name: Remove container
        if: always()
        run: docker rm -f ovadm-acceptance || true
