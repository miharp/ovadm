---
name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  gates:
    name: Release gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check metadata.json matches the tag
        run: |
          # The Forge takes its version from metadata.json and the Puppetfile
          # git form takes it from the tag, so the two have to agree.
          tag="${GITHUB_REF_NAME#v}"
          meta=$(ruby -rjson -e 'puts JSON.parse(File.read("metadata.json"))["version"]')
          echo "tag: $tag / metadata.json: $meta"
          if [ "$tag" != "$meta" ]; then
            echo "::error::metadata.json says $meta but the tag says $tag — bump metadata.json before tagging"
            exit 1
          fi

      - name: Check the changelog has an entry for the version
        run: .github/release-notes.sh "${GITHUB_REF_NAME#v}"

  # The same job as miharp/puppet-headscale: build, push to the Forge, then
  # create the GitHub release with the tarball attached.
  release:
    name: Release
    needs: gates
    uses: voxpupuli/gha-puppet/.github/workflows/release.yml@v4
    with:
      allowed_owner: 'miharp'
    secrets:
      # Configure secrets here:
      #  https://docs.github.com/en/actions/security-guides/encrypted-secrets
      username: ${{ secrets.PUPPET_FORGE_USERNAME }}
      api_key: ${{ secrets.PUPPET_FORGE_API_KEY }}

  notes:
    name: Release notes from the changelog
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace the generated notes with the changelog entry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .github/release-notes.sh "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/release-notes.md"
          gh release edit "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
