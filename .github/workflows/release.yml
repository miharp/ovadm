---
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Publish to the Forge and GitHub
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Check metadata.json matches the tag
        run: |
          # The Forge takes its version from metadata.json and the Puppetfile
          # git form takes it from the tag, so the two have to agree.
          tag="${GITHUB_REF_NAME#v}"
          meta=$(ruby -rjson -e 'puts JSON.parse(File.read("metadata.json"))["version"]')
          echo "tag: $tag / metadata.json: $meta"
          if [ "$tag" != "$meta" ]; then
            echo "::error::metadata.json says $meta but the tag says $tag — bump metadata.json before tagging"
            exit 1
          fi

      - name: Take the release notes from the changelog
        run: |
          # Everything between this version's heading and the next one. Failing
          # here is the point: an unreleased change with no changelog entry is
          # the thing that gets skipped, so the tag refuses to ship without one.
          tag="${GITHUB_REF_NAME#v}"
          awk -v v="$tag" '
            $0 ~ "^## \\[" v "\\]"          { found = 1; next }
            found && /^## \[/               { exit }
            found && /^\[[^]]+\]: /         { exit }
            found                           { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          if [ ! -s "$RUNNER_TEMP/release-notes.md" ]; then
            echo "::error::CHANGELOG.md has no entry for $tag"
            exit 1
          fi
          cat "$RUNNER_TEMP/release-notes.md"

      - name: Build the module
        run: |
          bundle exec metadata-json-lint metadata.json
          bundle exec rake module:build
          tar -tzf pkg/*.tar.gz

      - name: Publish to the Forge
        # Before the GitHub release, so a failed upload leaves nothing behind
        # but the tag: fix the cause and re-run this workflow. A version the
        # Forge has accepted can never be uploaded again, even after deletion.
        env:
          BLACKSMITH_FORGE_USERNAME: ${{ secrets.PUPPET_FORGE_USERNAME }}
          BLACKSMITH_FORGE_API_KEY: ${{ secrets.PUPPET_FORGE_API_KEY }}
        run: bundle exec rake module:push

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" pkg/*.tar.gz \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
